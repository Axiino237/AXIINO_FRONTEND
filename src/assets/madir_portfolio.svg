<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050c18" />
      <stop offset="50%" stop-color="#0a1628" />
      <stop offset="100%" stop-color="#040812" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="120" r="140" fill="#06b6d4" opacity="0.18" filter="url(#glow)" />
  <circle cx="650" cy="300" r="160" fill="#3b82f6" opacity="0.14" filter="url(#glow)" />

  <!-- Tech Grid Background Pattern -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- Central Glassmorphism Workspace Dashboard -->
  <g transform="translate(60, 45)">
    <!-- Main Window Outer Frame -->
    <rect width="680" height="360" rx="16" fill="#0b1329" fill-opacity="0.85" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />
    
    <!-- Window Header -->
    <rect width="680" height="48" rx="16" fill="rgba(255, 255, 255, 0.03)" />
    <!-- Window Controls -->
    <circle cx="28" cy="24" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="44" cy="24" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="60" cy="24" r="5" fill="#10b981" opacity="0.8" />
    
    <!-- Header Title & Status -->
    <text x="85" y="28" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">MADIR INTELLIGENCE — FINANCIAL RESEARCH &amp; DOCUMENT CONSOLE</text>
    <rect x="545" y="14" width="115" height="20" rx="10" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1" />
    <circle cx="557" cy="24" r="3.5" fill="#06b6d4" />
    <text x="566" y="28" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">LIVE PLATFORM</text>

    <!-- Sidebar: Uploaded Documents List -->
    <rect x="20" y="65" width="200" height="275" rx="10" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
    <text x="35" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">CENTRAL DOCUMENTS</text>
    
    <!-- Doc item 1 -->
    <rect x="30" y="105" width="180" height="46" rx="8" fill="rgba(6, 182, 212, 0.1)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1" />
    <rect x="40" y="116" width="24" height="24" rx="4" fill="#06b6d4" fill-opacity="0.2" />
    <path d="M48 123 h8 M48 128 h6 M48 133 h4" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round" />
    <text x="72" y="125" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Q3_Financials_Consol.pdf</text>
    <text x="72" y="139" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9">Analyzed • 142 metrics</text>

    <!-- Doc item 2 -->
    <rect x="30" y="160" width="180" height="46" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
    <rect x="40" y="171" width="24" height="24" rx="4" fill="#64748b" fill-opacity="0.2" />
    <path d="M48 178 h8 M48 183 h6 M48 188 h4" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <text x="72" y="180" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="500">Valuation_Model_v4.xlsx</text>
    <text x="72" y="194" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Processed • 4 sheets</text>

    <!-- Doc item 3 -->
    <rect x="30" y="215" width="180" height="46" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
    <rect x="40" y="226" width="24" height="24" rx="4" fill="#64748b" fill-opacity="0.2" />
    <path d="M48 233 h8 M48 238 h6 M48 243 h4" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <text x="72" y="235" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="500">Audit_Disclosures.pdf</text>
    <text x="72" y="249" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Extracted • 86 pages</text>

    <!-- Quick Upload Action Button -->
    <rect x="30" y="280" width="180" height="36" rx="8" fill="rgba(6, 182, 212, 0.2)" stroke="rgba(6, 182, 212, 0.5)" stroke-width="1" />
    <text x="120" y="303" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">+ UPLOAD NEW DOCUMENT</text>

    <!-- Main Content Panel: Decision Intelligence Analytics -->
    <!-- Metric 1 -->
    <rect x="235" y="65" width="135" height="70" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="247" y="86" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">NET ASSET VELOCITY</text>
    <text x="247" y="112" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">+28.4%</text>
    <text x="247" y="126" fill="#10b981" font-family="system-ui, sans-serif" font-size="9" font-weight="600">▲ Outperforming Benchmark</text>

    <!-- Metric 2 -->
    <rect x="382" y="65" width="135" height="70" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="394" y="86" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">DECISION CONFIDENCE</text>
    <text x="394" y="112" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="800">96.8 / 100</text>
    <text x="394" y="126" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Validated with Multi-Sources</text>

    <!-- Metric 3 -->
    <rect x="529" y="65" width="131" height="70" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="541" y="86" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">SYNTHESIZED INSIGHTS</text>
    <text x="541" y="112" fill="#c084fc" font-family="system-ui, sans-serif" font-size="20" font-weight="800">1,480+</text>
    <text x="541" y="126" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Cross-Doc Linked</text>

    <!-- Graph View Card -->
    <rect x="235" y="148" width="425" height="192" rx="10" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />
    <text x="250" y="172" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">INTELLIGENCE SYNTHESIS TIMELINE</text>
    <text x="580" y="172" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="10" font-weight="600">1M  3M  6M  1Y  ALL</text>

    <!-- Chart Line & Fill -->
    <path d="M260 290 Q320 250 370 260 T460 210 T550 220 T630 185 L630 305 L260 305 Z" fill="url(#chartGrad)" />
    <path d="M260 290 Q320 250 370 260 T460 210 T550 220 T630 185" fill="none" stroke="#06b6d4" stroke-width="2.5" />
    <!-- Data points -->
    <circle cx="370" cy="260" r="4" fill="#38bdf8" stroke="#0b1329" stroke-width="2" />
    <circle cx="460" cy="210" r="4" fill="#38bdf8" stroke="#0b1329" stroke-width="2" />
    <circle cx="550" cy="220" r="4" fill="#38bdf8" stroke="#0b1329" stroke-width="2" />
    <circle cx="630" cy="185" r="5" fill="#f8fafc" stroke="#06b6d4" stroke-width="2" />

    <!-- Chart Indicator Tooltip -->
    <rect x="525" y="152" width="100" height="28" rx="6" fill="#030712" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1" />
    <text x="575" y="170" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Index: +42.8%</text>
  </g>
</svg>